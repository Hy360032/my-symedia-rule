movie:
   # 日系特摄电影
  特摄剧/特摄剧电影/日系特摄电影:
    genre_ids: "-16"
    ?include_keywords: "tokusatsu,ultraman,kaiju"
    ?keywords: "奥特曼"
    original_language: "ja"
    series_keywords: "奥特曼"

  # 华语特摄电影（含大陆、港台）
  特摄剧/特摄剧电影/华语特摄电影:
    genre_ids: "-16"
    keywords: "tokusatsu,特摄,特攝,铠甲勇士,金甲战士,超神战队,巨神战击队"
    original_language: "zh,cn"

  特摄剧/特摄剧电影/其他特摄电影:
    genre_ids: "-16"
    ?include_keywords: "tokusatsu"
    ?keywords: "Power Rangers,超凡战队,恐龙战队,VR Troopers,Beetleborgs,BIMA,神鹰勇士,Cicak-Man,Shaktimaan,Darna"


  # 优先级 2：纪录片
  纪录片/纪录片电影/华语纪录片电影:
    genre_ids: "99,-10402,-16"
    ?original_language: "zh,cn"
    ?origin_country: "CN,TW,HK,MO"
  纪录片/纪录片电影/外语纪录片电影:
    original_language: "-zh,-cn"
    genre_ids: "99,-16,"

  # 演唱会
  演唱会/华语歌手演唱会:
    genre_ids: "10402,-16"
    ?original_language: "zh,cn,-ja"
