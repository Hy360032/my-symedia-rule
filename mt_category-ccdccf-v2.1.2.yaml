  演唱会/欧美歌手演唱会:
    genre_ids: "10402,-16"
    keywords: "演唱会,巡演,演出,交响乐,奇妙夜,歌剧,喜乐会,音乐会,音乐·会,音乐剧,特别节目,摇滚,MV精选集,Live,日本武道馆,Concert,Tour,Performance,Show,Stage,现场,現場,巡演,巡迴,巡回,演出,音乐节,音樂節,歌会,音乐集,演奏,音乐秀,音乐盛宴"
